# Conda environment for the X-Ray Spectral Fitting benchmark.
#
#   conda env create -f environment.yml
#   conda activate ScienceBench_XraySpectralFitting
#
# Sherpa with the XSPEC model library is only distributed through the Chandra
# X-ray Center (CXC) conda channel below. The conda-forge `sherpa` package has
# NO XSPEC models (xstbabs, xsbbody, ...) and will not work for this project.
# CXC builds exist for linux-64, osx-64 and osx-arm64 (no linux-aarch64).
name: ScienceBench_XraySpectralFitting
channels:
  - https://cxc.cfa.harvard.edu/conda/ciao
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - sherpa=4.18.0
  # CIAO 4.18's pycrates (Sherpa's default FITS I/O backend) still uses
  # numpy.chararray, which numpy 2.5 removed; with 2.5.x every `load_pha`
  # fails with "No usable I/O backend was imported".
  - numpy>=2.3.5,<2.5
  # astropy provides Sherpa's alternative FITS I/O backend; the oracle falls back
  # to it automatically if pycrates cannot be imported.
  - astropy
  - pyyaml
  - pip
  - pip:
    - litellm
