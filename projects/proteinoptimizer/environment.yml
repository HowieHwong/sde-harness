name: ScienceBench_ProteinOptimizer
channels:
  - conda-forge
dependencies:
  - python=3.11   # 3.11+ required by current litellm (uses typing.NotRequired)
  - pip
  - pip:
      # Numeric / plotting stack (installed via pip to keep conda solve trivial)
      - numpy>=1.21.0
      - scipy>=1.9.0
      - pandas>=1.3.0
      - matplotlib>=3.5.0
      - seaborn
      - pyyaml
      - tabulate            # analyze.py uses df.to_markdown()
      # PyTorch CPU wheel is fine for the smoke path; swap for a CUDA wheel if you need GPU.
      - torch>=2.0.0
      # ProteinOptimizer-specific
      - omegaconf
      # Core sde-harness framework dependencies
      - litellm>=1.73.6
      - weave>=0.51.54
      - tenacity>=8.0.0
      - asyncio-throttle>=1.0.0
      # LLM providers
      - openai>=1.0.0
      - anthropic>=0.25.0
      - google-generativeai>=0.3.0
      # Install sde-harness in editable mode from repo root
      - -e ../..
