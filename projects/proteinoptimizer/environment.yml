name: ScienceBench_ProteinOptimizer
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.21.0
  - scipy>=1.9.0
  - pandas>=1.3.0
  - pyyaml
  - matplotlib>=3.5.0
  - seaborn
  - pytorch>=2.0.0
  - pip:
      # Core sde-harness framework dependencies
      - litellm>=1.73.6
      - weave>=0.51.54
      - tenacity>=8.0.0
      - asyncio-throttle>=1.0.0
      # LLM providers
      - openai>=1.0.0
      - anthropic>=0.25.0
      - google-generativeai>=0.3.0
      # ProteinOptimizer-specific
      - omegaconf
      # Install sde-harness in editable mode from repo root
      - -e ../..
